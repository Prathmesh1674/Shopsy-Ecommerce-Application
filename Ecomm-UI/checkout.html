<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Shopsy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">Checkout</h2>

    <div class="row">

        <!-- Customer Details -->
        <div class="col-md-7">

            <div class="card">

                <div class="card-header">
                    Shipping Details
                </div>

                <div class="card-body">

                    <form id="checkoutForm">

                        <div class="mb-3">
                            <label>Name</label>
                            <input
                                    id="name"
                                    class="form-control"
                                    required>
                        </div>

                        <div class="mb-3">
                            <label>Phone</label>
                            <input
                                    id="phone"
                                    class="form-control"
                                    required>
                        </div>

                        <div class="mb-3">
                            <label>Address</label>
                            <textarea
                                    id="address"
                                    class="form-control"
                                    rows="3"
                                    required></textarea>
                        </div>

                        <button
                                type="submit"
                                class="btn btn-success" >

                            Place Order

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <!-- Order Summary -->
        <div class="col-md-5">

            <div class="card">

                <div class="card-header">

                    Order Summary

                </div>

                <div class="card-body">

                    <div id="orderSummary"></div>

                    <hr>

                    <h4>

                        Total :
                        ₹<span id="totalAmount">0</span>

                    </h4>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
<script> checkLogin(); </script>

</body>
</html>
