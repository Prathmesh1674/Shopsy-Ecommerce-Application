<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Shopsy</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e2e3e9 0%,
                    #eae8ec 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.20);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #0933ed,
                #3315da
            );

            color: white;
            font-size: 28px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .brand p {
            color: #777;
            margin: 0;
        }

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .input-group-text {
            background: #f8f9fa;
            border-right: none;
        }

        .form-control {
            padding: 12px;
            border-left: none;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #4808f8;
        }

        .input-group:focus-within {
            box-shadow: 0 0 0 2px rgba(118, 75, 162, 0.15);
            border-radius: 8px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0832ef,
                #2004f5
            );

            color: white;
            font-size: 16px;
            font-weight: 600;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(118, 75, 162, 0.3);
        }

        .register-link {
            color: #3407f9;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: white;
            text-decoration: none;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        .password-toggle {
            cursor: pointer;
            border-left: none;
        }

    </style>

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <!-- BRAND -->
        <div class="brand">

            <div class="brand-icon">

                <i class="fas fa-shopping-bag"></i>

            </div>

            <h1>SHOPSY</h1>

            <p>Welcome back!</p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <!-- EMAIL -->

            <div class="mb-4">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fas fa-envelope"></i>

                    </span>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fas fa-lock"></i>

                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                    <span
                        class="input-group-text password-toggle"
                        onclick="togglePassword()">

                        <i
                            id="passwordIcon"
                            class="fas fa-eye">
                        </i>

                    </span>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                <i class="fas fa-right-to-bracket me-2"></i>

                Login

            </button>

        </form>


        <hr class="my-4">


        <!-- REGISTER -->

        <p class="text-center mb-0">

            Don't have an account?

            <a
                href="register.html"
                class="register-link">

                Create Account

            </a>

        </p>

    </div>


    

</div>


<!-- YOUR EXISTING LOGIN JS -->

<script src="js/login.js"></script>


<!-- Password Toggle -->

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const icon =
        document.getElementById("passwordIcon");


    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}

</script>

</body>

</html>
