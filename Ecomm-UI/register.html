<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Shopsy</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f0f0f2 0%,
                    #f0eff2 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

        }

        .auth-container {

            width: 100%;
            max-width: 450px;

            padding: 20px;

        }

        .auth-card {

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);

        }

        .brand {

            text-align: center;

            margin-bottom: 25px;

        }

        .brand-icon {

            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #0430f6,
                    #3206f7
                );

            color: white;

            font-size: 28px;

        }

        .brand h1 {

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 5px;

        }

        .brand p {

            color: #777;

            margin: 0;

        }

        .form-label {

            font-weight: 600;

            color: #333;

        }

        .input-group-text {

            background: #f8f9fa;

            border-right: none;

        }

        .form-control {

            padding: 12px;

            border-left: none;

        }

        .form-control:focus {

            box-shadow: none;

            border-color: #1605f8;

        }

        .input-group:focus-within {

            box-shadow:
                0 0 0 2px
                rgba(118, 75, 162, 0.15);

            border-radius: 8px;

        }

        .register-btn {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0331fe,
                    #2605f7
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            transition: 0.3s;

        }

        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(118, 75, 162, 0.3);

        }

        .login-link {

            color: #1606f7;

            font-weight: 600;

            text-decoration: none;

        }

        .login-link:hover {

            text-decoration: underline;

        }

        .back-home {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: white;

            text-decoration: none;

        }

        .back-home:hover {

            text-decoration: underline;

        }

        .password-toggle {

            cursor: pointer;

            border-left: none;

        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">

                <i class="fas fa-shopping-bag"></i>

            </div>

            <h1>SHOPSY</h1>

            <p>Create your account</p>

        </div>


        <!-- REGISTER FORM -->

        <form id="registerForm">


            <!-- NAME -->

            <div class="mb-3">

                <label
                    for="name"
                    class="form-label">

                    Full Name

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fas fa-user"></i>

                    </span>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fas fa-envelope"></i>

                    </span>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fas fa-lock"></i>

                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password"
                        required>

                    <span
                        class="input-group-text password-toggle"
                        onclick="togglePassword('password','passwordIcon')">

                        <i
                            id="passwordIcon"
                            class="fas fa-eye">
                        </i>

                    </span>

                </div>

            </div>

            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-btn">

                <i class="fas fa-user-plus me-2"></i>

                Create Account

            </button>


        </form>


        <hr class="my-4">


        <!-- LOGIN -->

        <p class="text-center mb-0">

            Already have an account?

            <a
                href="login.html"
                class="login-link">

                Login

            </a>

        </p>


    </div>


    

</div>


<!-- YOUR EXISTING REGISTER JS -->
<script src="js/api.js"></script> 
<script src="js/regester.js"></script>


<!-- Password Toggle -->

<script>   

function togglePassword(inputId, iconId) {

    const password =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);


    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}

</script>


</body>

</html>
